name: Development Deployment

on:
  push:
    branches:
      - development
    paths:
      - 'Dockerfile'
      - 'docker-compose.dev.yml'
      - '.github/workflows/development.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js application
        run: npm run build

      - name: Verify .next directory contents
        run: ls -lah .next  # Debugging to ensure .next exists after build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && (github.event.head_commit.modified contains 'Dockerfile' || github.event.head_commit.modified contains 'docker-compose.dev.yml')
        run: |
          docker build -t gibbydev/development-image:latest .
          docker push gibbydev/development-image:latest

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Development Server
        run: |
          echo "Starting deployment to development server..."
          ssh -o StrictHostKeyChecking=no -p 2222 dev@71.213.133.168 << 'EOF'
            set -e
            cd /home/dev/portfolio
            echo "Pulling latest Docker image..."
            docker pull gibbydev/development-image:latest
            echo "Starting Docker containers..."
            docker compose -f docker-compose.dev.yml up -d --build
            echo "Deployment to development server completed."
            echo "Checking container status..."
            docker ps -a
            echo "Fetching container logs..."
            docker logs portfolio-app-1 || true
            echo "Checking for exited containers..."
            if [ "$(docker ps -a -f status=exited -q)" ]; then
              echo "Exited containers found. Fetching logs..."
              docker ps -a -f status=exited
              docker logs portfolio-app-1
              echo "Checking .next directory contents..."
              docker exec portfolio-app-1 ls -lah /app/.next
              exit 1
            else
              echo "No exited containers found."
            fi
          EOF
